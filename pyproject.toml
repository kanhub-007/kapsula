[project]
name = "kapsula"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.5",
    "ddgs>=9.9.1",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "unstructured[md]>=0.16.0",
    "tiktoken>=0.8.0",
    "faiss-cpu>=1.13.0",
    "rank-bm25>=0.2.2",
    "huggingface_hub>=1.1.5",
    "aiohttp>=3.13.2",
    "sentence-transformers",
    "scikit-learn>=1.0.0",
    "fastmcp>=3.0.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "openapi-python-client==0.28.0"
]

[tool.ruff]
line-length = 88
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
# Enable rules beyond the default set that match project conventions.
# F = pyflakes, E/W = pycodestyle, I = isort (import ordering),
# UP = pyupgrade (Optional -> | None), G = logging format, N = naming.
select = ["E", "F", "I", "UP", "G", "W"]
ignore = [
    "E501",   # line length handled by black
    "G004",   # f-string logging: too widespread to fix atomically; tracked separately
]

[tool.ruff.lint.per-file-ignores]
# MCP tool modules legitimately use module-level cached singletons (documented
# exception in AGENTS.md).
"kapsula/presentation/mcp/**" = ["E402"]

[tool.black]
line-length = 88

