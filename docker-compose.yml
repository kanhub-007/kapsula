version: '3.8'

services:
  kapsula-api:
    build: .
    container_name: kapsula-api
    networks:
      - kapsula-network
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - hq_data:/app/data
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kapsula-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: kapsula-mcp
    environment:
      - PYTHONUNBUFFERED=1
      - HF_TOKEN=${HF_TOKEN}
      - KAPSULA_TRANSPORT=${KAPSULA_TRANSPORT:-stdio}
      - KAPSULA_PORT=8002
    volumes:
      - mcp_data:/app/data
      - ./.env:/app/.env:ro
    stdin_open: true   # Keep stdin open for stdio transport
    tty: false         # No TTY needed for stdio
    # Uncomment for HTTP mode:
    # ports:
    #   - "8002:8002"

networks:
  kapsula-network:
    driver: bridge

volumes:
  hq_data:
  mcp_data:
